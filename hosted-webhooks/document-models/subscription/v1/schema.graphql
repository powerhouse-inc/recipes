type SubscriptionState {
  customerId: String!
  plan: String!
  seats: Int!
  status: SubscriptionStatus!
  lastFailureReason: String
  processedEventIds: [String!]!
}

enum SubscriptionStatus {
  PENDING
  ACTIVE
  PAST_DUE
  CANCELED
}

# subscription

input ActivateInput {
  eventId: String!
  customerId: String!
  plan: String!
  seats: Int!
}

input MarkPastDueInput {
  eventId: String!
  reason: String!
}

input CancelInput {
  eventId: String!
}