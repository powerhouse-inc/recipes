allowBuilds:
  '@apollo/protobufjs': true
  '@datadog/pprof': false
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msw: true
  onnxruntime-node: true
  prisma: true
  protobufjs: true
  sharp: true
  sqlite3: true

# The 6.2.0-dev line (npm `dev` dist-tag). The document-drive package was
# deleted upstream — its drive document model now lives at
# @powerhousedao/shared/document-drive — and reactor declares its dependencies
# properly from 6.1.0 on, so the whole family versions together as one group.
catalog:
  "@powerhousedao/analytics-engine-browser": 6.2.0-dev.33
  "@powerhousedao/analytics-engine-core": 6.2.0-dev.33
  "@powerhousedao/ph-cli": 6.2.0-dev.33
  "@powerhousedao/reactor": 6.2.0-dev.33
  "@powerhousedao/reactor-browser": 6.2.0-dev.33
  "@powerhousedao/shared": 6.2.0-dev.33
  "@renown/sdk": 6.2.0-dev.33
  document-model: 6.2.0-dev.33

packages:
  - analytics-processor
  - audit-trail
  - batch-progress
  - db-migrate
  - cross-document-reactor
  - custom-read-model
  - discord-webhook-processor
  - document-acl
  - document-snapshot-exporter
  - document-versioning
  - drive-override
  - external-feed-ingest
  - full-text-search
  - inbound-webhook-bridge
  - rate-limiter
  - relational-db-subgraph
  - role-based-auth
  - saga
  - semantic-search
  - signed-operations-verifier
  - subscription-cli
  - sync-health-monitor
