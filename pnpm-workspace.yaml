  utf-8-validate: false

# The 6.2.3-dev line (npm `dev` dist-tag). The document-drive package was
# deleted upstream — its drive document model now lives at
# @powerhousedao/shared/document-drive — and reactor declares its dependencies
# properly from 6.1.0 on, so the whole family versions together as one group.
# Carried forward from the 6.2.2-dev line: the
# ReactorBuilder.withDocumentModelSources rename the recipes already use, the
# complete auth-scope enforcement stages (all four feature flags through
# authConditions), the @powerhousedao/reactor-group document model the
# group-principals recipe depends on, IReactorClient.evaluateActions /
# useCanExecute (the read-only admission preflight the auth-preflight recipe is
# built on), per-scope read filtering (scoped-reads), and the
# document-model/mock subpath generateMock moved to.
# 6.2.3-dev.4 added what anonymous-subscriptions reads: a tokenless websocket
# answered as the http path answers it, and the two named 4403 close reasons
# (authentication-required, bearer-rejected) that replaced graphql-ws's own
# Forbidden.
# 6.2.3-dev.25 carries action signature integrity: ISigner.signAction takes the
# document and branch it signs for and emits a v2 tuple, the reactor verifies
# every write it stores, new documents are v2-required, and SignerConfig takes
# the trustPolicy the auth recipes give their reactors.
# 6.2.3-dev.70 carries what package-styles builds against: packages ship only
# their own CSS through Connect's package stylesheet entry
# (@powerhousedao/connect/tailwind.css, powerhouse#3262), and ph build no longer
# scans dist/browser's source maps for class names (f3bfe645e9).
# It also carries the typed editor props editor-props is written against:
# EditorProps<TDocument, TAction>, EditorModule's document and action type
# parameters, and the DocumentDispatch export (powerhouse#3261).
# 6.2.3-dev.71 carries what connect-routes runs against: Connect's studio boots
# in a project that installs it (powerhouse#3266, #3265) and connect-core ships
# its route files compiled (powerhouse#3268).
# It also carries the host-core output tokens host-output-tokens resolves:
# resolveHostOutputs and the $output, $concat and $env tokens (powerhouse#3258).
# 6.2.3-dev.75 carries ProcessorRecord.replayState, which replay-state sets per
# processor (powerhouse#3289 documents it).
# 6.2.3-dev.77 carries what host-check builds against: host-core's checkHost,
# which runs the ph run pipeline up to the verb and returns every issue, and
# the ph host check command over it (powerhouse#3287).
# 6.2.3-dev.78 carries what spawn-host runs against: switchboard reports the
# bound port, so runner.port: 0 works (powerhouse#3285).
# 6.2.3-dev.0 onward carries the HTTP scope API hosted-webhooks uses
# (subgraph.http, package routes and hosted webhooks, powerhouse#2980).
