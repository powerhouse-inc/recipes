# powerhouse-vetra-packages, which Connect loads, imports these packages
# without declaring them; 6.2.3-dev.78 still does. Without the extension it
# resolves whatever copy pnpm hoists. With the whole family on the catalog that
# copy is the same release, so the extension guards against drift rather than
# fixing a mismatch. The key names one version: move it and the versions with
# the catalog, or the extension stops applying.
packageExtensions:
  '@powerhousedao/powerhouse-vetra-packages@6.2.3-dev.78':
    dependencies:
      '@powerhousedao/design-system': 6.2.3-dev.78
      '@powerhousedao/reactor-browser': 6.2.3-dev.78
      '@powerhousedao/shared': 6.2.3-dev.78
      document-model: 6.2.3-dev.78

