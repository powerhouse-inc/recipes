allowBuilds:
  '@apollo/protobufjs': true
  '@datadog/pprof': false
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msw: true
  onnxruntime-node: true
  prisma: true
  protobufjs: true
  sharp: true
  sqlite3: true

# The 6.2.3-dev line (npm `dev` dist-tag). The document-drive package was
# deleted upstream — its drive document model now lives at
# @powerhousedao/shared/document-drive — and reactor declares its dependencies
# properly from 6.1.0 on, so the whole family versions together as one group.
# Carried forward from the 6.2.2-dev line: the
# ReactorBuilder.withDocumentModelSources rename the recipes already use, the
# complete auth-scope enforcement stages (all four feature flags through
# authConditions), the @powerhousedao/reactor-group document model the
# group-principals recipe depends on, IReactorClient.evaluateActions /
# useCanExecute (the read-only admission preflight the auth-preflight recipe is
# built on), per-scope read filtering (scoped-reads), and the
# document-model/mock subpath generateMock moved to.
# 6.2.3-dev.4 added what anonymous-subscriptions reads: a tokenless websocket
# answered as the http path answers it, and the two named 4403 close reasons
# (authentication-required, bearer-rejected) that replaced graphql-ws's own
# Forbidden.
catalog:
  "@powerhousedao/analytics-engine-browser": 6.2.3-dev.11
  "@powerhousedao/analytics-engine-core": 6.2.3-dev.11
  "@powerhousedao/ph-cli": 6.2.3-dev.11
  "@powerhousedao/reactor": 6.2.3-dev.11
  "@powerhousedao/reactor-browser": 6.2.3-dev.11
  "@powerhousedao/reactor-group": 6.2.3-dev.11
  "@powerhousedao/shared": 6.2.3-dev.11
  "@renown/sdk": 6.2.3-dev.11
  document-model: 6.2.3-dev.11

packages:
  - analytics-processor
  - anonymous-subscriptions
  - audit-trail
  - auth-preflight
  - batch-progress
  - db-migrate
  - cross-document-reactor
  - custom-read-model
  - discord-webhook-processor
  - document-acl
  - document-snapshot-exporter
  - document-versioning
  - drive-override
  - external-feed-ingest
  - full-text-search
  - group-principals
  - inbound-webhook-bridge
  - positional-delete
  - rate-limiter
  - relational-db-subgraph
  - revocation-race
  - role-based-auth
  - saga
  - scoped-reads
  - semantic-search
  - signed-operations-verifier
  - subscription-cli
  - sync-health-monitor
