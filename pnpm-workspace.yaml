allowBuilds:
  '@apollo/protobufjs': true
  '@datadog/pprof': false
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msw: true
  onnxruntime-node: true
  prisma: true
  protobufjs: true
  sharp: true
  sqlite3: true

# The 6.2.2-dev line (npm `dev` dist-tag). The document-drive package was
# deleted upstream — its drive document model now lives at
# @powerhousedao/shared/document-drive — and reactor declares its dependencies
# properly from 6.1.0 on, so the whole family versions together as one group.
# 6.2.2-dev.50 carries the ReactorBuilder.withDocumentModelSources rename the
# recipes already use, the complete auth-scope enforcement stages (all four
# feature flags through authConditions), and the @powerhousedao/reactor-group
# document model the group-principals recipe depends on.
catalog:
  "@powerhousedao/analytics-engine-browser": 6.2.2-dev.50
  "@powerhousedao/analytics-engine-core": 6.2.2-dev.50
  "@powerhousedao/ph-cli": 6.2.2-dev.50
  "@powerhousedao/reactor": 6.2.2-dev.50
  "@powerhousedao/reactor-browser": 6.2.2-dev.50
  "@powerhousedao/reactor-group": 6.2.2-dev.50
  "@powerhousedao/shared": 6.2.2-dev.50
  "@renown/sdk": 6.2.2-dev.50
  document-model: 6.2.2-dev.50

packages:
  - analytics-processor
  - audit-trail
  - batch-progress
  - db-migrate
  - cross-document-reactor
  - custom-read-model
  - discord-webhook-processor
  - document-acl
  - document-snapshot-exporter
  - document-versioning
  - drive-override
  - external-feed-ingest
  - full-text-search
  - group-principals
  - inbound-webhook-bridge
  - positional-delete
  - rate-limiter
  - relational-db-subgraph
  - revocation-race
  - role-based-auth
  - saga
  - scoped-reads
  - semantic-search
  - signed-operations-verifier
  - subscription-cli
  - sync-health-monitor
