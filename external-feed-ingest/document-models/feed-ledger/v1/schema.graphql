type FeedLedgerState {
  source: String!
  watermark: Int!
  entries: [LedgerEntry!]!
}

type LedgerEntry {
  externalId: String!
  sequence: Int!
  payload: String!
  recordedAt: String!
  status: LedgerEntryStatus!
  supersededBy: String
}

enum LedgerEntryStatus {
  RECORDED
  SUPERSEDED
}

# ingest

input RecordEntryInput {
  externalId: String!
  sequence: Int!
  payload: String!
  ts: String!
}

input MarkSupersededInput {
  supersededId: String!
  externalId: String!
  sequence: Int!
  payload: String!
  ts: String!
}