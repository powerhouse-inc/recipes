type PaymentState {
  orderId: String!
  amountCents: Int!
  currency: String!
  status: PaymentStatus!
  failureReason: String
  processedEventIds: [String!]!
}

enum PaymentStatus {
  PENDING
  PAID
  FAILED
  REFUNDED
}

# payment

input RecordPaymentInput {
  eventId: String!
  amountCents: Int!
}

input MarkFailedInput {
  eventId: String!
  reason: String!
}

input RecordRefundInput {
  eventId: String!
  amountCents: Int!
}